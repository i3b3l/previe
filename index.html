<script>

async function load(files){const token=++revision;const selected=Array.from(files).filter(f=>!f.type||f.type.startsWith('image/'));if(!selected.length){$('status').textContent='Escolha arquivos de imagem.';return}$('status').textContent='Carregando fotos…';const checked=await Promise.all(selected.map(f=>new Promise(resolve=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>resolve({url,blob:f});img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url})));const valid=checked.filter(Boolean);if(token!==revision){release(valid);return}if(!valid.length){$('status').textContent='Não foi possível abrir as fotos. Tente JPG ou PNG.';return}const wasEmpty=!photos.length;photos.push(...valid);if(wasEmpty)index=0;render();if(!requestedPersistence&&navigator.storage?.persist){requestedPersistence=true;navigator.storage.persist().catch(()=>{})}$('status').textContent=valid.length<files.length?'Algumas fotos não puderam ser abertas.':''}
const pick=()=>$('file').click();$('pick').onclick=pick;$('emptyPick').onclick=pick;$('addMore').onclick=pick;$('file').onchange=()=>{const files=Array.from($('file').files);$('file').value='';if(files.length)load(files)};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('tapPrev').onclick=()=>{if(Date.now()>=suppressClickUntil)move(-1)};$('tapNext').onclick=()=>{if(Date.now()>=suppressClickUntil)move(1)};
$('phone').addEventListener('pointerdown',e=>{$('phone').classList.add('pointer-mode');if(!photos.length||!e.isPrimary||e.button!==0)return;start={x:e.clientX,y:e.clientY,id:e.pointerId}});
$('phone').addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.2){suppressClickUntil=Date.now()+450;move(dx<0?1:-1)}});$('phone').addEventListener('pointercancel',()=>{start=null});$('phone').addEventListener('pointerleave',()=>{start=null});
document.addEventListener('keydown',e=>{$('phone').classList.remove('pointer-mode');if(!photos.length||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});
$('phone').addEventListener('dragover',e=>e.preventDefault());$('phone').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)load(e.dataTransfer.files)});
initialize();})();
</script>
</body></html>
