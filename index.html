<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff2f7">
<title>prevu. — antes de postar</title>
<style>
:root{color-scheme:light;--bg:#fff2f7;--panel:#fffafd;--line:#edcfdc;--text:#442837;--muted:#805b70;--accent:#b64979}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:650}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.35;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}[hidden]{display:none!important}header{max-width:900px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:32px;font-weight:850;letter-spacing:-2.7px;line-height:1}.logo span{color:#d780a5}.tag{color:var(--muted);font-size:12px}main{max-width:880px;margin:auto;padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}.phone{position:relative;width:min(100%,max(200px,calc((100dvh - 235px)*9/16)),390px);aspect-ratio:9/16;border-radius:24px;overflow:hidden;background:#171417;box-shadow:0 0 0 1px #e8bdcf,0 16px 50px #ad6b8c24;isolation:isolate;touch-action:pan-y;color:#fff}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;color:#fff;text-shadow:0 1px 8px #0009}.top{background:linear-gradient(#0008,transparent);padding:12px 12px 35px}.progress{display:flex;gap:3px;margin-bottom:12px}.progress span{flex:1;min-width:0;height:2.5px;background:#ffffff65;border-radius:3px}.progress span.seen{background:#fff}.progress span.current{background:linear-gradient(90deg,#fff 52%,#ffffff65 52%)}.profile{display:flex;align-items:center;gap:8px;font-size:11px}.avatar{width:30px;height:30px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;flex:none}.avatar svg,.reply svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.profile strong{display:block;font-size:12px;line-height:1.3}.profile small{opacity:.8}.close{margin-left:auto;font-size:24px;line-height:1}.reply{display:flex;gap:10px;align-items:center;font-size:12px;padding:30px 12px 15px;background:linear-gradient(transparent,#0005)}.field{border:1px solid #ffffffb0;border-radius:24px;padding:10px 12px;flex:1;background:#0002}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:22px;gap:8px}.empty-icon{display:grid;place-items:center;width:48px;height:48px;border:1px dashed #e4b1c7;border-radius:14px;margin:0 auto 4px;font-size:25px;color:#ffd5e6}.empty strong{font-size:17px}.empty p{font-size:12px;color:#f7d8e5;margin:0}.empty button{margin:8px auto 0}.tap{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent!important;border-radius:0;padding:0;touch-action:pan-y}.tap.prev{left:0}.tap.next{right:0}.tap:focus-visible{outline:2px solid #f4bfd4;outline-offset:-4px}.nav{display:flex;align-items:center;gap:16px;width:min(100%,390px);justify-content:center}.nav button{width:44px;height:40px;padding:0;font-size:21px}.count{min-width:100px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}.actions{width:min(100%,390px);display:flex;gap:8px}.actions button{flex:1}.note,footer{color:var(--muted);font-size:11px;text-align:center;margin:0}.note{min-height:17px}footer{padding:0 18px 20px}#status{color:var(--accent);font-size:12px;text-align:center;margin:0;max-width:390px}#status:empty{display:none}@media(max-width:450px){header{padding:12px 16px}main{padding:12px 14px;gap:10px}.phone{border-radius:20px}.tag{font-size:11px}}@media(max-height:650px){.phone{width:min(100%,max(175px,calc((100dvh - 210px)*9/16)),340px)}}

.sequence{width:min(100%,390px);display:flex;flex-direction:column;gap:8px}.sequence-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.sequence-head strong{color:var(--text)}.filmstrip{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:5px 3px 8px;scrollbar-width:thin;scrollbar-color:#e5b4ca transparent;overscroll-behavior-x:contain}.thumb{position:relative;flex:0 0 55px;width:55px;height:76px;padding:0;overflow:hidden;border:2px solid transparent;border-radius:9px;background:#e9d6df;touch-action:pan-x}.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}.thumb.active{border-color:var(--accent);outline:2px solid #edbfd3;outline-offset:1px}.thumb .num{position:absolute;bottom:3px;left:3px;min-width:16px;padding:0 3px;background:#211d20bb;color:white;border-radius:5px;font-size:10px;line-height:16px;text-align:center;pointer-events:none}.thumb .grip{position:absolute;top:0;right:0;display:grid;place-items:center;width:26px;height:30px;background:#211d20bb;color:white;border-radius:0 0 0 9px;touch-action:none;cursor:grab;font-size:17px;line-height:1}.thumb.dragging{opacity:.4}.thumb.target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.add-thumb{flex:0 0 55px;height:76px;border:1px dashed #ce8da8;background:#fffafd;color:var(--accent);font-size:25px;display:grid;place-items:center;padding:0}.sequence-actions{display:flex;gap:6px;align-items:center}.sequence-actions button{padding:8px 10px;min-height:38px;font-size:12px}.sequence-actions .remove{margin-left:auto;color:#a33b62}.drag-ghost{position:fixed;z-index:1000;width:55px;height:76px;object-fit:cover;border-radius:9px;border:2px solid #b64979;pointer-events:none;opacity:.9;box-shadow:0 6px 18px #0004;transform:translate(-50%,-50%)}.sequence-actions #undo{color:var(--accent)}.note{line-height:1.4}
.phone,.photo,.tap{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.tap:active,.tap:focus{box-shadow:none}.phone.pointer-mode .tap:focus{outline:none}
</style>
</head>
<body>
<header><div class="logo">prevu<span>.</span></div><div class="tag">Antes de postar.</div></header>
<main>
<div class="phone" id="phone" aria-label="Simulador de Stories">
<img class="photo" id="photo" alt="" draggable="false" hidden>
<div class="overlay" id="overlay"><div class="top"><div class="progress" id="progress" aria-hidden="true"><span></span></div><div class="profile"><div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div><div><strong id="profileName">Seu story</strong><small>Agora</small></div><span class="close" id="close">×</span></div></div><div class="reply"><div class="field" id="replyText">Enviar mensagem...</div><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg><svg id="shareIcon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></div></div>
<div class="empty" id="empty"><div class="empty-icon">+</div><strong>Como vai ficar seu story?</strong><p>Selecione várias fotos e veja uma por uma.</p><button id="emptyPick" class="primary">Escolher fotos</button></div>
<button class="tap prev" id="tapPrev" aria-label="Foto anterior" hidden></button><button class="tap next" id="tapNext" aria-label="Próxima foto" hidden></button>
</div>
<div class="nav" id="nav" hidden><button id="prev" aria-label="Foto anterior">‹</button><div class="count" id="count" aria-live="polite"></div><button id="next" aria-label="Próxima foto">›</button></div>
<section class="sequence" id="sequence" hidden aria-label="Organizar sequência"><div class="sequence-head"><strong>Sequência</strong><span id="total"></span></div><div class="filmstrip" id="strip" aria-label="Miniaturas da sequência"></div><div class="sequence-actions"><button id="moveLeft" aria-label="Mover foto selecionada para a esquerda">← Mover</button><button id="moveRight" aria-label="Mover foto selecionada para a direita">Mover →</button><button id="undo" hidden>Desfazer</button><button class="remove" id="remove" aria-label="Remover foto selecionada da sequência">Excluir</button></div></section><div class="actions" id="initialActions"><button id="pick" class="primary">+ Escolher fotos</button></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<p class="note" id="note">Toque nas laterais ou deslize para passar as fotos.</p><p id="status" role="status"></p>
</main>
<footer><span id="storageNote" role="status">Suas fotos ficam neste dispositivo.</span> Nada é publicado.</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let photos=[],index=0,start=null,suppressClickUntil=0,revision=0,removed=null,drag=null,db=null,ready=false,saveVersion=0,requestedPersistence=false;
function openStorage(){return new Promise((resolve,reject)=>{const req=indexedDB.open('prevu-local',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('session'))req.result.createObjectStore('session')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Armazenamento bloqueado'))})}
function readStorage(){return new Promise((resolve,reject)=>{const tx=db.transaction('session','readonly'),req=tx.objectStore('session').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onabort=()=>reject(tx.error)})}
function saveSession(){if(!ready||!db)return;const version=++saveVersion;try{const tx=db.transaction('session','readwrite');tx.objectStore('session').put({photos:photos.map(p=>p.blob),index},'current');tx.oncomplete=()=>{if(version===saveVersion)$('storageNote').textContent=photos.length?'Sequência salva neste navegador.':'Suas fotos ficam neste dispositivo.'};tx.onabort=tx.onerror=()=>{if(version===saveVersion)$('storageNote').textContent='Não foi possível salvar. As alterações podem sumir ao atualizar.'}}catch(e){$('storageNote').textContent='Não foi possível salvar neste navegador.'}}
async function initialize(){const main=document.querySelector('main');main.inert=true;$('storageNote').textContent='Recuperando sequência…';try{db=await openStorage();const saved=await readStorage();if(saved&&Array.isArray(saved.photos)){photos=saved.photos.filter(b=>b instanceof Blob).map(blob=>({blob,url:URL.createObjectURL(blob)}));index=Math.max(0,Math.min(photos.length-1,Number.isInteger(saved.index)?saved.index:0))}db.onversionchange=()=>{db.close();db=null;$('storageNote').textContent='Armazenamento indisponível. Reabra o aplicativo.'};$('storageNote').textContent=photos.length?'Sequência salva neste navegador.':'Suas fotos ficam neste dispositivo.'}catch(e){if(db)db.close();db=null;$('storageNote').textContent='Memória local indisponível. Fotos não serão recuperadas ao atualizar.'}finally{ready=true;main.inert=false;render(false)}}
function render(persist=true){if(persist)saveSession();const has=photos.length>0;$('sequence').hidden=!has&&!removed;$('initialActions').hidden=has;renderStrip();$('empty').hidden=has;$('photo').hidden=!has;$('nav').hidden=!has;$('tapPrev').hidden=!has;$('tapNext').hidden=!has;$('pick').textContent=has?'Escolher outras fotos':'+ Escolher fotos';$('progress').replaceChildren();for(let n=0;n<Math.max(1,photos.length);n++){const bar=document.createElement('span');bar.className=has?(n<index?'seen':n===index?'current':''):'';$('progress').append(bar)}if(!has){$('photo').removeAttribute('src');$('count').textContent='';return}$('photo').src=photos[index].url;$('photo').alt='Foto '+(index+1)+' de '+photos.length;$('count').textContent=(index+1)+' / '+photos.length;$('prev').disabled=index===0;$('next').disabled=index===photos.length-1;}
function renderStrip(){const strip=$('strip'),oldScroll=strip.scrollLeft;strip.replaceChildren();photos.forEach((item,n)=>{const b=document.createElement('button');b.className='thumb'+(n===index?' active':'');b.dataset.index=n;b.setAttribute('aria-label','Foto '+(n+1));b.setAttribute('aria-pressed',String(n===index));const img=document.createElement('img');img.src=item.url;img.alt='';img.draggable=false;const num=document.createElement('span');num.className='num';num.textContent=n+1;const grip=document.createElement('span');grip.className='grip';grip.textContent='⠿';grip.title='Arraste para mudar de posição';grip.setAttribute('aria-hidden','true');b.append(img,num,grip);b.onclick=()=>{if(Date.now()<suppressClickUntil)return;index=n;render()};grip.addEventListener('pointerdown',e=>beginDrag(e,n,b));strip.append(b)});const add=document.createElement('button');add.className='add-thumb';add.textContent='+';add.setAttribute('aria-label','Adicionar mais fotos');add.onclick=()=>$('file').click();strip.append(add);strip.scrollLeft=oldScroll;$('total').textContent=photos.length+' '+(photos.length===1?'foto':'fotos');$('moveLeft').disabled=!photos.length||index===0;$('moveRight').disabled=!photos.length||index===photos.length-1;$('remove').disabled=!photos.length;$('undo').hidden=!removed;const active=strip.querySelector('.active');if(active){const a=active.getBoundingClientRect(),r=strip.getBoundingClientRect();if(a.left<r.left)strip.scrollLeft-=r.left-a.left+5;else if(a.right>r.right)strip.scrollLeft+=a.right-r.right+5;}}
function reorder(from,to){if(from===to||from<0||to<0||from>=photos.length||to>=photos.length)return;const selected=photos[index],item=photos.splice(from,1)[0];photos.splice(to,0,item);index=photos.indexOf(selected);render()}
function clearRemoved(){if(removed){release([removed.item]);removed=null}}
$('moveLeft').onclick=()=>reorder(index,index-1);$('moveRight').onclick=()=>reorder(index,index+1);
$('remove').onclick=()=>{if(!photos.length)return;clearRemoved();removed={item:photos.splice(index,1)[0],position:index};index=Math.max(0,Math.min(index,photos.length-1));render();$('status').textContent='Foto removida da sequência. Original preservado.'};
$('undo').onclick=()=>{if(!removed)return;const at=Math.min(removed.position,photos.length);photos.splice(at,0,removed.item);index=at;removed=null;render();$('status').textContent='Foto restaurada.'};
function beginDrag(e,n,b){if(!e.isPrimary||e.button!==0||drag)return;e.preventDefault();e.stopPropagation();const handle=e.currentTarget;handle.setPointerCapture(e.pointerId);const ghost=document.createElement('img');ghost.className='drag-ghost';ghost.src=photos[n].url;ghost.alt='';document.body.append(ghost);b.classList.add('dragging');drag={from:n,to:n,handle,ghost,b,id:e.pointerId};updateDrag(e);handle.addEventListener('pointermove',updateDrag);handle.addEventListener('pointerup',endDrag);handle.addEventListener('pointercancel',cancelDrag);handle.addEventListener('lostpointercapture',cancelDrag)}
function updateDrag(e){if(!drag||e.pointerId!==drag.id)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';const strip=$('strip'),r=strip.getBoundingClientRect();if(e.clientX<r.left+30)strip.scrollLeft-=12;else if(e.clientX>r.right-30)strip.scrollLeft+=12;const thumbs=[...strip.querySelectorAll('.thumb')];const inside=thumbs.filter(t=>{const a=t.getBoundingClientRect();return a.right>=r.left&&a.left<=r.right});if(inside.length){const nearest=inside.reduce((best,t)=>Math.abs(t.getBoundingClientRect().left+t.offsetWidth/2-e.clientX)<Math.abs(best.getBoundingClientRect().left+best.offsetWidth/2-e.clientX)?t:best);drag.to=Number(nearest.dataset.index);thumbs.forEach(t=>t.classList.toggle('target',t===nearest&&drag.to!==drag.from))}}
function finishDrag(e,commit){if(!drag||e.pointerId!==drag.id)return;const {from,to,handle,ghost,b}=drag;drag=null;handle.removeEventListener('pointermove',updateDrag);handle.removeEventListener('pointerup',endDrag);handle.removeEventListener('pointercancel',cancelDrag);handle.removeEventListener('lostpointercapture',cancelDrag);ghost.remove();b.classList.remove('dragging');$('strip').querySelectorAll('.target').forEach(t=>t.classList.remove('target'));suppressClickUntil=Date.now()+450;if(commit){index=from;if(from===to)render();else reorder(from,to)}}
function endDrag(e){finishDrag(e,true)}function cancelDrag(e){finishDrag(e,false)}
function move(delta){const target=index+delta;if(target>=0&&target<photos.length){index=target;render()}}
function release(items){items.forEach(item=>URL.revokeObjectURL(item.url))}
async function load(files){const token=++revision;const selected=Array.from(files).filter(f=>!f.type||f.type.startsWith('image/'));if(!selected.length){$('status').textContent='Escolha arquivos de imagem.';return}$('status').textContent='Carregando fotos…';const checked=await Promise.all(selected.map(f=>new Promise(resolve=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>resolve({url,blob:f});img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url})));const valid=checked.filter(Boolean);if(token!==revision){release(valid);return}if(!valid.length){$('status').textContent='Não foi possível abrir as fotos. Tente JPG ou PNG.';return}const wasEmpty=!photos.length;photos.push(...valid);if(wasEmpty)index=0;render();if(!requestedPersistence&&navigator.storage?.persist){requestedPersistence=true;navigator.storage.persist().catch(()=>{})}$('status').textContent=valid.length<files.length?'Algumas fotos não puderam ser abertas.':''}
const pick=()=>$('file').click();$('pick').onclick=pick;$('emptyPick').onclick=pick;$('file').onchange=()=>{const files=Array.from($('file').files);$('file').value='';if(files.length)load(files)};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('tapPrev').onclick=()=>{if(Date.now()>=suppressClickUntil)move(-1)};$('tapNext').onclick=()=>{if(Date.now()>=suppressClickUntil)move(1)};
$('phone').addEventListener('pointerdown',e=>{$('phone').classList.add('pointer-mode');if(!photos.length||!e.isPrimary||e.button!==0)return;start={x:e.clientX,y:e.clientY,id:e.pointerId}});
$('phone').addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.2){suppressClickUntil=Date.now()+450;move(dx<0?1:-1)}});$('phone').addEventListener('pointercancel',()=>{start=null});$('phone').addEventListener('pointerleave',()=>{start=null});
document.addEventListener('keydown',e=>{$('phone').classList.remove('pointer-mode');if(!photos.length||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});
$('phone').addEventListener('dragover',e=>e.preventDefault());$('phone').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)load(e.dataTransfer.files)});
initialize();})();
</script>
</body></html>
