<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff2f7">
<title>prevu. — antes de postar</title>
<style>
:root{color-scheme:light;--bg:#fff2f7;--panel:#fffafd;--line:#edcfdc;--text:#442837;--muted:#805b70;--accent:#b64979}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:650}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.35;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}[hidden]{display:none!important}header{max-width:900px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:32px;font-weight:850;letter-spacing:-2.7px;line-height:1}.logo span{color:#d780a5}.tag{color:var(--muted);font-size:12px}main{max-width:880px;margin:auto;padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:15px;width:min(100%,390px)}.tabs button{flex:1;background:none;border:0;font-size:12px;padding:9px 3px;color:var(--muted);border-radius:10px;white-space:nowrap}.tabs button.active{background:#f8d7e6;color:#602b45}.phone{position:relative;width:min(100%,max(200px,calc((100dvh - 250px)*9/16)),390px);aspect-ratio:9/16;border-radius:24px;overflow:hidden;background:#171417;box-shadow:0 0 0 1px #e8bdcf,0 16px 50px #ad6b8c24;isolation:isolate;touch-action:pan-y;color:#fff}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;color:#fff;text-shadow:0 1px 8px #0009}.top{background:linear-gradient(#0008,transparent);padding:12px 12px 35px}.progress{display:flex;gap:3px;margin-bottom:12px}.progress span{flex:1;min-width:0;height:2.5px;background:#ffffff65;border-radius:3px}.progress span.seen{background:#fff}.progress span.current{background:linear-gradient(90deg,#fff 52%,#ffffff65 52%)}.profile{display:flex;align-items:center;gap:8px;font-size:11px}.avatar{width:30px;height:30px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;flex:none}.avatar svg,.reply svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.profile strong{display:block;font-size:12px;line-height:1.3}.profile small{opacity:.8}.close{margin-left:auto;font-size:24px;line-height:1}.reply{display:flex;gap:10px;align-items:center;font-size:12px;padding:30px 12px 15px;background:linear-gradient(transparent,#0005)}.field{border:1px solid #ffffffb0;border-radius:24px;padding:10px 12px;flex:1;background:#0002}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:22px;gap:8px}.empty-icon{display:grid;place-items:center;width:48px;height:48px;border:1px dashed #e4b1c7;border-radius:14px;margin:0 auto 4px;font-size:25px;color:#ffd5e6}.empty strong{font-size:17px}.empty p{font-size:12px;color:#f7d8e5;margin:0}.empty button{margin:8px auto 0}.tap{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent!important;border-radius:0;padding:0;touch-action:pan-y}.tap.prev{left:0}.tap.next{right:0}.tap:focus-visible{outline:2px solid #f4bfd4;outline-offset:-4px}.nav{display:flex;align-items:center;gap:16px;width:min(100%,390px);justify-content:center}.nav button{width:44px;height:40px;padding:0;font-size:21px}.count{min-width:100px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}.actions{width:min(100%,390px);display:flex;gap:8px}.actions button{flex:1}.note,footer{color:var(--muted);font-size:11px;text-align:center;margin:0}.note{min-height:17px}footer{padding:0 18px 20px}#status{color:var(--accent);font-size:12px;text-align:center;margin:0;max-width:390px}#status:empty{display:none}@media(max-width:450px){header{padding:12px 16px}main{padding:12px 14px;gap:10px}.phone{border-radius:20px}.tag{font-size:11px}}@media(max-height:650px){.phone{width:min(100%,max(175px,calc((100dvh - 210px)*9/16)),340px)}}
</style>
</head>
<body>
<header><div class="logo">prevu<span>.</span></div><div class="tag">Antes de postar.</div></header>
<main>
<div class="tabs" role="group" aria-label="Plataforma"><button class="active" data-platform="instagram" aria-pressed="true">Instagram</button><button data-platform="whatsapp" aria-pressed="false">WhatsApp</button><button data-platform="facebook" aria-pressed="false">Facebook</button><button data-platform="clean" aria-pressed="false">Livre</button></div>
<div class="phone" id="phone" aria-label="Simulador de Stories">
<img class="photo" id="photo" alt="" draggable="false" hidden>
<div class="overlay" id="overlay"><div class="top"><div class="progress" id="progress" aria-hidden="true"><span></span></div><div class="profile"><div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></div><div><strong id="profileName">Seu story</strong><small>Agora</small></div><span class="close" id="close">×</span></div></div><div class="reply"><div class="field" id="replyText">Enviar mensagem...</div><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6Z"/></svg><svg id="shareIcon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></div></div>
<div class="empty" id="empty"><div class="empty-icon">+</div><strong>Como vai ficar seu story?</strong><p>Selecione várias fotos e veja uma por uma.</p><button id="emptyPick" class="primary">Escolher fotos</button></div>
<button class="tap prev" id="tapPrev" aria-label="Foto anterior" hidden></button><button class="tap next" id="tapNext" aria-label="Próxima foto" hidden></button>
</div>
<div class="nav" id="nav" hidden><button id="prev" aria-label="Foto anterior">‹</button><div class="count" id="count" aria-live="polite"></div><button id="next" aria-label="Próxima foto">›</button></div>
<div class="actions"><button id="pick" class="primary">+ Escolher fotos</button></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<p class="note" id="note">Toque nas laterais ou deslize para passar as fotos.</p><p id="status" role="status"></p>
</main>
<footer>Suas fotos ficam no dispositivo. Nada é publicado.</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let photos=[],index=0,platform='instagram',start=null,suppressClickUntil=0,revision=0;
function overlay(){const wa=platform==='whatsapp';$('overlay').hidden=platform==='clean';$('profileName').textContent=wa?'Meu status':'Seu story';$('replyText').textContent=wa?'Responder':'Enviar mensagem...';$('close').textContent=wa?'⋮':'×';$('shareIcon').style.display=wa?'none':'';}
function render(){const has=photos.length>0;$('empty').hidden=has;$('photo').hidden=!has;$('nav').hidden=!has;$('tapPrev').hidden=!has;$('tapNext').hidden=!has;$('pick').textContent=has?'Escolher outras fotos':'+ Escolher fotos';$('progress').replaceChildren();for(let n=0;n<Math.max(1,photos.length);n++){const bar=document.createElement('span');bar.className=has?(n<index?'seen':n===index?'current':''):'';$('progress').append(bar)}if(!has){$('photo').removeAttribute('src');$('count').textContent='';return}$('photo').src=photos[index].url;$('photo').alt='Foto '+(index+1)+' de '+photos.length;$('count').textContent=(index+1)+' / '+photos.length;$('prev').disabled=index===0;$('next').disabled=index===photos.length-1;}
function move(delta){const target=index+delta;if(target>=0&&target<photos.length){index=target;render()}}
function release(items){items.forEach(item=>URL.revokeObjectURL(item.url))}
async function load(files){const token=++revision;const selected=Array.from(files).filter(f=>!f.type||f.type.startsWith('image/'));if(!selected.length){$('status').textContent='Escolha arquivos de imagem.';return}$('status').textContent='Carregando fotos…';const checked=await Promise.all(selected.map(f=>new Promise(resolve=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>resolve({url});img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url})));const valid=checked.filter(Boolean);if(token!==revision){release(valid);return}if(!valid.length){$('status').textContent='Não foi possível abrir as fotos. Tente JPG ou PNG.';return}release(photos);photos=valid;index=0;render();$('status').textContent=valid.length<files.length?'Algumas fotos não puderam ser abertas.':''}
const pick=()=>$('file').click();$('pick').onclick=pick;$('emptyPick').onclick=pick;$('file').onchange=()=>{const files=Array.from($('file').files);$('file').value='';if(files.length)load(files)};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('tapPrev').onclick=()=>{if(Date.now()>=suppressClickUntil)move(-1)};$('tapNext').onclick=()=>{if(Date.now()>=suppressClickUntil)move(1)};
$('phone').addEventListener('pointerdown',e=>{if(!photos.length||!e.isPrimary||e.button!==0)return;start={x:e.clientX,y:e.clientY,id:e.pointerId}});
$('phone').addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.2){suppressClickUntil=Date.now()+450;move(dx<0?1:-1)}});$('phone').addEventListener('pointercancel',()=>{start=null});$('phone').addEventListener('pointerleave',()=>{start=null});
document.addEventListener('keydown',e=>{if(!photos.length||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});
document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{platform=b.dataset.platform;document.querySelectorAll('[data-platform]').forEach(k=>{const active=k===b;k.classList.toggle('active',active);k.setAttribute('aria-pressed',String(active))});overlay()});
$('phone').addEventListener('dragover',e=>e.preventDefault());$('phone').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)load(e.dataTransfer.files)});
overlay();render();})();
</script>
</body></html>
